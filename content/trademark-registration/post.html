<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Trademark registration</title>
<link rel="stylesheet" href="../../brand/samples/tokens.css">
<link rel="stylesheet" href="../../brand/components/bundle.css">
<style>
html,body{margin:0;background:#fff}
/* Full-bleed render: the brass mark sits lower right on the mist studio floor, the headline takes the clear wall top left. */
.ci-post--render{background:var(--surface-mist) url(img/registered.jpg) center / cover no-repeat}
/* Single post, so the footer carries the one call to action instead of a swipe cue. */
.ci-cta{display:inline-flex;align-items:center;gap:12px;padding:12px 26px 12px 28px;border:2px solid #c9d6e0;border-radius:var(--radius-pill);background:rgba(255,255,255,.72);font-family:var(--font-sans);font-size:26px;font-weight:600;color:var(--ink)}
.ci-cta b{font-weight:800;letter-spacing:.04em}
.ci-cta::after{content:"\2192";font-size:28px;color:var(--gold)}
</style></head><body>
<div class="ci-post ci-post--render">
<div class="ci-post__head"><img class="ci-logo ci-logo--standard" src="../../brand/assets/Logos/connectin-logo.png" alt="ConnectIn Business Services"></div>
<div class="ci-post__main"><div class="ci-stack"><p class="ci-lead">Your trade licence<br>won’t protect your</p><p class="ci-keyword ci-keyword--gold">Brand</p><span class="ci-tag">A TRADEMARK WILL</span></div></div>
<div class="ci-post__foot"><span class="ci-cta">DM us <b>“TRADEMARK”</b></span></div>
</div>
</body></html>
