<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ConnectIn</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .navy { fill:var(--headline); }
  .gold { fill:var(--gold-leaf); }
  .blue { fill:var(--blue); }
  .mist { fill:var(--surface-mist); }
  .leaf { fill:var(--gold-leaf); }
  .blk { rx:var(--radius-tag); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:80px; line-height:.92; font-weight:800; letter-spacing:-.02em; color:var(--headline); }
  .name i { font-style:normal; color:var(--gold); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; font-style:italic; font-weight:400; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      headline navy 176x254 slab bled off the top (the brand) · gold-leaf 128x128 · blue 160x192 bled off the right · surface-mist 128x72 relief tint — about 30% of 960x288
  arrangement one tall navy slab with satellites, bottoms on one line space-6 above the edge, space-2 gutters
  pattern     the pointer triangle (the feed's one marker, "one mark: gold triangle"), 12 units cut into the slab at a space-4 pitch
  scales      gutters space-2; pitch space-4; bottom inset space-6; corners radius-tag
-->
<rect class="navy blk" x="0" y="-14" width="176" height="254" rx="14"/>
<rect class="mist blk" x="192" y="24" width="128" height="72" rx="14"/>
<rect class="gold blk" x="192" y="112" width="128" height="128" rx="14"/>
<rect class="blue blk" x="336" y="48" width="160" height="192" rx="14"/>
<path class="leaf" d="M32 128l18 10-18 10z"/>
<path class="leaf" d="M64 128l18 10-18 10z"/>
<path class="leaf" d="M96 128l18 10-18 10z"/>
<path class="leaf" d="M128 128l18 10-18 10z"/>
<path class="leaf" d="M32 160l18 10-18 10z"/>
<path class="leaf" d="M64 160l18 10-18 10z"/>
<path class="leaf" d="M96 160l18 10-18 10z"/>
<path class="leaf" d="M128 160l18 10-18 10z"/>
<path class="leaf" d="M32 192l18 10-18 10z"/>
<path class="leaf" d="M64 192l18 10-18 10z"/>
<path class="leaf" d="M96 192l18 10-18 10z"/>
<path class="leaf" d="M128 192l18 10-18 10z"/>
</svg>
</div>
<div class="words">
<h1 class="name">Connect<i>In</i></h1>
<p class="tag">Neat. Fast. Reliable.</p>
</div>
</div>
</body>
</html>
