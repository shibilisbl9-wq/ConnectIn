<script type="module">
// ConnectIn moodboard renders: one studio, four still lifes.
// ?s=capsule|chess|towers|paper&w=&h=  (+ tuning params read below)
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
const S = q.get('s') || 'capsule';
const W = num('w', 1200), H = num('h', 1200);

// ?alpha=1 renders the object and its floor shadow on a transparent background, for compositing
const ALPHA = q.get('alpha') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: ALPHA });

renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.NeutralToneMapping;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = q.get('vsm') ? THREE.VSMShadowMap : THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 300);

// ---------- studio environment (reflections only; set per material) ----------
const pmrem = new THREE.PMREMGenerator(renderer);
function studioEnv(extra = []) {
  const env = new THREE.Scene();
  const geo = new THREE.SphereGeometry(20, 64, 32);
  const col = [], c = new THREE.Color(), top = new THREE.Color('#b4bec7'), bot = new THREE.Color('#353d44');
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const t = (p.getY(i) / 20 + 1) / 2; c.copy(bot).lerp(top, Math.pow(t, 0.8)); col.push(c.r, c.g, c.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  env.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
  const panel = (w, h, pos, k, color = '#ffffff') => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); env.add(m);
  };
  panel(9, 6, [-8, 10, 6], 7);                 // key softbox, top left front
  panel(2, 14, [12, 2, 2], 5, '#f4f8fb');       // strip, right
  panel(12, 4, [0, 3, 14], 1.6);               // front fill
  panel(16, 16, [0, 16, -2], 1.8, '#eef3f7');   // overhead
  panel(3, 10, [-12, 1, -6], 3.5, '#fff4e6');   // warm rim, back left
  extra.forEach(a => panel(...a));
  return pmrem.fromScene(env, 0.02).texture;
}
let ENV = null;
const env = (m, k = 1) => { m.envMap = ENV; m.envMapIntensity = k; return m; };

// ---------- helpers ----------
function cyc({ width = 16, depth = 10, height = 9, radius = 2.4, color = '#e8eff5', rough = 1, k = 0.25, lift = 0 }) {
  const prof = [];
  for (let i = 0; i <= 24; i++) prof.push([depth * (1 - i / 24), 0]);
  for (let i = 1; i <= 48; i++) { const a = (i / 48) * Math.PI / 2; prof.push([-Math.sin(a) * radius, radius - Math.cos(a) * radius]); }
  for (let i = 1; i <= 16; i++) prof.push([-radius, radius + (height - radius) * i / 16]);
  const pos = [], idx = [];
  prof.forEach(([z, y]) => pos.push(-width / 2, y, z, width / 2, y, z));
  for (let i = 0; i < prof.length - 1; i++) { const a = i * 2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, env(new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0, side: THREE.DoubleSide, emissive: color, emissiveIntensity: lift }), k));
  m.receiveShadow = true;
  return m;
}
function keyLight({ pos = [-3, 5, 3], target = [0, 0.3, 0], intensity = 3, color = '#ffffff', size = 3, radius = 6, map = 2048, far = 40 }) {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.set(...pos); l.target.position.set(...target);
  l.castShadow = true;
  l.shadow.mapSize.set(map, map);
  const c = l.shadow.camera; c.left = -size; c.right = size; c.top = size; c.bottom = -size; c.near = 0.1; c.far = far;
  c.updateProjectionMatrix();
  l.shadow.bias = -0.0003; l.shadow.normalBias = 0.006;
  l.shadow.radius = radius; l.shadow.blurSamples = 24;
  scene.add(l, l.target);
  return l;
}
function fill(pos, intensity = 0.5, color = '#dfeaf4') {
  const l = new THREE.DirectionalLight(color, intensity); l.position.set(...pos); scene.add(l); return l;
}
function blindsTexture({ slats = 16, open = 0.58, blur = 5, mullion = true }) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 1024, 1024);
  g.filter = `blur(${blur}px)`;
  g.fillStyle = '#fff';
  const p = 1024 / slats;
  for (let i = 0; i < slats; i++) g.fillRect(-40, i * p + p * (1 - open) / 2, 1104, p * open);
  if (mullion) { g.fillStyle = '#000'; g.fillRect(492, -40, 40, 1104); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function gobo({ pos, target, intensity = 60, color = '#fff1dc', angle = 0.42, penumbra = 0.35, texture }) {
  const s = new THREE.SpotLight(color, intensity, 0, angle, penumbra, 2);
  s.position.set(...pos); s.target.position.set(...target);
  s.map = texture; s.castShadow = true;
  s.shadow.mapSize.set(2048, 2048); s.shadow.bias = -0.0003; s.shadow.radius = 4; s.shadow.blurSamples = 16;
  s.shadow.camera.near = 0.5; s.shadow.camera.far = 30;

}
const brass = (rough = 0.28, k = 1) => env(new THREE.MeshPhysicalMaterial({ color: q.get('brass') ? '#' + q.get('brass') : '#dcc088', metalness: 1, roughness: rough, anisotropy: 0.4 }), k);
const navyLacquer = (k = num('nk', 1)) => env(new THREE.MeshPhysicalMaterial({ color: q.get('nc') ? '#' + q.get('nc') : '#0a3552', roughness: 0.32, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06 }), k);
const ivory = (k = 0.9) => env(new THREE.MeshPhysicalMaterial({ color: '#f4f1ea', roughness: 0.45, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.25 }), k);
const shadowed = o => o.traverse(x => { if (x.isMesh) { x.castShadow = true; x.receiveShadow = true; } });

function profile(segs) {
  const pts = [];
  for (const s of segs) for (const p of s) { const last = pts[pts.length - 1]; if (!last || Math.hypot(last.x - p[0], last.y - p[1]) > 1e-5) pts.push(new THREE.Vector2(p[0], p[1])); }

}
const line = (a, b, n = 2) => Array.from({ length: n + 1 }, (_, i) => [a[0] + (b[0] - a[0]) * i / n, a[1] + (b[1] - a[1]) * i / n]);

function pawnGeo() {
  return new THREE.LatheGeometry(profile([
    line([0, 0], [0.40, 0]), arc([0.40, 0.02], 0.02, -90, 0, 8), line([0.42, 0.02], [0.42, 0.05]), arc([0.40, 0.05], 0.02, 0, 90, 8),
    quad([0.40, 0.07], [0.33, 0.07], [0.34, 0.10]), arc([0.34, 0.12], 0.02, -90, 90, 12),
    quad([0.34, 0.14], [0.16, 0.17], [0.15, 0.40], 24), line([0.15, 0.40], [0.14, 0.50]),
    line([0.14, 0.50], [0.24, 0.51]), arc([0.24, 0.53], 0.02, -90, 90, 10), line([0.24, 0.55], [0.14, 0.56]),
    quad([0.14, 0.56], [0.11, 0.59], [0.12, 0.623]), arc([0, 0.77], 0.19, -50.8, 90, 40),
  ]), 128);
}
function king(mat) {
  const pts = profile([
    line([0, 0], [0.48, 0]), arc([0.48, 0.02], 0.02, -90, 0, 8), line([0.50, 0.02], [0.50, 0.06]), arc([0.48, 0.06], 0.02, 0, 90, 8),
    quad([0.48, 0.08], [0.41, 0.08], [0.42, 0.12]), arc([0.42, 0.14], 0.02, -90, 90, 12),
    line([0.42, 0.16], [0.36, 0.17]), quad([0.36, 0.17], [0.17, 0.30], [0.17, 1.02], 32),
    line([0.17, 1.02], [0.30, 1.06]), arc([0.30, 1.085], 0.025, -90, 90, 10), line([0.30, 1.11], [0.18, 1.12]),
    line([0.18, 1.12], [0.26, 1.13]), arc([0.26, 1.145], 0.015, -90, 90, 8), line([0.26, 1.16], [0.18, 1.17]),
    quad([0.18, 1.17], [0.20, 1.36], [0.33, 1.48], 24), arc([0.31, 1.49], 0.02, -30, 90, 8),
    quad([0.31, 1.51], [0.18, 1.57], [0, 1.575], 16),
  ]);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 128), mat));
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.065, 48, 32), mat); ball.position.y = 1.6; g.add(ball);
  const v = new THREE.Mesh(new RoundedBoxGeometry(0.075, 0.27, 0.075, 4, 0.012), mat); v.position.y = 1.78; g.add(v);
  const h = new THREE.Mesh(new RoundedBoxGeometry(0.21, 0.075, 0.075, 4, 0.012), mat); h.position.y = 1.8; g.add(h);
  shadowed(g);
  return g;
}
function flattenCaps(g) {

  const pos = g.attributes.position, nor = g.attributes.normal;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3(), e = new THREE.Vector3();
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    n.subVectors(c, b).cross(e.subVectors(a, b)).normalize();
    if (Math.abs(n.z) > 0.9995) for (let k = 0; k < 3; k++) nor.setXYZ(i + k, n.x, n.y, n.z);

async function glyphGeo(ch, { font = '../../fonts/Urbanist-ExtraBold.ttf', depth = 0.1, bevel = 0.012 } = {}) {
  const json = await new Promise((res, rej) => new TTFLoader().load(font, res, undefined, rej));
  const shapes = new Font(json).generateShapes(ch, 1);
  let g = new THREE.ExtrudeGeometry(shapes, { depth: 1, bevelEnabled: false, curveSegments: 32 });
  g.computeBoundingBox();
  const w = g.boundingBox.max.x - g.boundingBox.min.x;   // normalise: glyph width 1
  g = new THREE.ExtrudeGeometry(shapes.map(sh => { const t = new THREE.Shape(sh.getPoints(32).map(p => p.divideScalar(w))); t.holes = sh.holes.map(hh => new THREE.Path(hh.getPoints(32).map(p => p.divideScalar(w)))); return t; }),
    { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.5, bevelSegments: 8, curveSegments: 1 });

async function capsuleGeo(depth = 0.08) {
  const d = await (await fetch('capsule.json')).json();

  const inner = d.inner.map(p => new THREE.Vector2(p[0], p[1]));
  if (!THREE.ShapeUtils.isClockWise(outer)) outer.reverse();
  if (THREE.ShapeUtils.isClockWise(inner)) inner.reverse();
  const shape = new THREE.Shape(outer); shape.holes.push(new THREE.Path(inner));
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.0045, bevelSegments: 8, curveSegments: 1, steps: 1 });
  g.center();
  return flattenCaps(toCreasedNormals(g, Math.PI / 5));
}

// ---------- scenes ----------
async function sceneCapsule() {
  ENV = studioEnv([[10, 22, [-10, 2, 9], num('face', 5), '#ffffff']]);
  scene.background = new THREE.Color('#eaf1f6');
  const c = cyc({ k: num('fenv', 0.3) }); c.position.z = -1.2; scene.add(c);
  const geo = await capsuleGeo(num('depth', 0.08));
  geo.computeBoundingBox();
  const m = new THREE.Mesh(geo, brass(num('rough', 0.26), num('menv', 1.1)));
  m.position.set(0.02, (geo.boundingBox.max.y - geo.boundingBox.min.y) / 2, 0); m.rotation.y = num('rot', -0.32);
  shadowed(m); scene.add(m);
  keyLight({ pos: [-2.6, 4.2, 2.4], target: [0, 0.2, 0], intensity: num('key', 2.6), size: 1.6, radius: num('rad', 8), map: num('map', 2048) });
  fill([3, 1.6, 2.5], num('fill', 0.5));
  if (q.get('gobo') !== '0') gobo({ pos: [-4.2, 2.6, 1.8], target: [0.2, 0.55, -0.9], intensity: num('gi', 90), texture: blindsTexture({ slats: 14, open: 0.55, blur: 6 }) });

  camera.position.set(num('cx', 0.5), num('cy', 0.58), num('cz', 2.6)); camera.lookAt(0.02, num('ly', 0.3), -0.05);
}

async function sceneChess() {

// ---------- cover objects for the October posts ----------
// One object per cover, same camera and light as the registered-mark post, so the covers read as a series.
function lathe(pts, seg = 96) { return new THREE.LatheGeometry(profile(pts), seg); }
const glass = (k = 1.6) => env(new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.04, metalness: 0, transparent: true, opacity: 0.28,
  clearcoat: 1, clearcoatRoughness: 0.03, side: THREE.DoubleSide, depthWrite: false }), k);
const whiteMatte = (k = 0.5) => env(new THREE.MeshStandardMaterial({ color: '#f3f5f7', roughness: 0.55 }), k);

function hourglass() {
  const g = new THREE.Group(), B = brass(0.24), Ht = 1.25;
  const plate = () => lathe([line([0, 0], [0.40, 0]), arc([0.40, 0.015], 0.015, -90, 0, 6), line([0.415, 0.015], [0.415, 0.045]),
    arc([0.40, 0.045], 0.015, 0, 90, 6), line([0.40, 0.06], [0, 0.06])]);
  const bottom = new THREE.Mesh(plate(), B); g.add(bottom);
  const top = new THREE.Mesh(plate(), B); top.position.y = Ht - 0.06; g.add(top);
  for (let k = 0; k < 3; k++) {
    const a = k * Math.PI * 2 / 3 + Math.PI / 6;
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, Ht - 0.12, 24), B);
    post.position.set(Math.cos(a) * 0.335, Ht / 2, Math.sin(a) * 0.335); g.add(post);
  }
  // double bulb: half profile from the cap (u = 1) to the neck (u = 0), mirrored
  const half = new THREE.SplineCurve([[0.12, 1], [0.22, 0.93], [0.27, 0.75], [0.26, 0.55], [0.18, 0.35], [0.08, 0.17], [0.034, 0]].map(p => new THREE.Vector2(p[0], p[1]))).getPoints(40);
  const y0 = 0.06, span = (Ht - 0.12) / 2, mid = y0 + span;
  const bulb = [...half.map(p => [p.x, mid - p.y * span]).reverse().slice(0, -1).reverse().reverse(), ...half.slice().reverse().map(p => [p.x, mid + p.y * span])];
  bulb.sort((a, b) => a[1] - b[1]);
  g.add(new THREE.Mesh(new THREE.LatheGeometry(bulb.map(p => new THREE.Vector2(p[0], p[1])), 96), glass()));
  const sand = env(new THREE.MeshStandardMaterial({ color: '#d8c08c', roughness: 0.95 }), 0.4);
  g.add(new THREE.Mesh(lathe([line([0, y0 + 0.005], [0.235, y0 + 0.005]), quad([0.235, y0 + 0.005], [0.2, y0 + 0.16], [0, y0 + 0.3], 20)]), sand));
  const r = y => { const u = (y - mid) / span; let best = half[0]; for (const p of half) if (Math.abs(p.y - u) < Math.abs(best.y - u)) best = p; return best.x - 0.012; };
  const fill = mid + span * 0.42, pts = [[0, mid + 0.02]];
  for (let y = mid + 0.02; y <= fill; y += 0.01) pts.push([r(y), y]);
  pts.push([r(fill) * 0.4, fill - 0.015], [0, fill - 0.03]);
  g.add(new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 96), sand));
  const stream = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, mid - (y0 + 0.3), 12), sand); stream.position.y = (mid + y0 + 0.3) / 2; g.add(stream);
  g.rotation.y = 0.3;
  return g;
}

function arrowShape(len = 0.62, h = 0.15, tip = 0.12) {
  const s = new THREE.Shape();
  s.moveTo(0, -h / 2); s.lineTo(len - tip, -h / 2); s.lineTo(len, 0); s.lineTo(len - tip, h / 2); s.lineTo(0, h / 2); s.lineTo(0, -h / 2);
  return s;
}
function signpost() {
  const g = new THREE.Group(), B = brass(0.24), N = navyLacquer();
  g.add(new THREE.Mesh(lathe([line([0, 0], [0.2, 0]), arc([0.2, 0.012], 0.012, -90, 0, 6), line([0.212, 0.012], [0.212, 0.04]), quad([0.212, 0.04], [0.1, 0.05], [0.05, 0.07]), line([0.05, 0.07], [0, 0.07])]), B));
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.28, 32), N); post.position.y = 0.07 + 0.64; g.add(post);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.042, 32, 16), B); cap.position.y = 1.37; g.add(cap);
  const board = (mat, y, rot) => {
    const geo = new THREE.ExtrudeGeometry(arrowShape(), { depth: 0.035, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 4 });
    geo.translate(0.02, 0, -0.0175);
    const m = new THREE.Mesh(flattenCaps(toCreasedNormals(geo, Math.PI / 5)), mat); m.position.y = y; m.rotation.y = rot; g.add(m);
  };
  board(B, 1.16, Math.PI - 0.42);   // one way
  board(N, 0.93, -0.5);             // the other
  return g;
}

async function cardOnMarble() {
  const g = new THREE.Group();
  const tex = await new THREE.TextureLoader().loadAsync(q.get('marble') || '../img/marble.jpg');
  tex.colorSpace = THREE.SRGBColorSpace;
  const slab = new THREE.Mesh(new RoundedBoxGeometry(1.0, 0.07, 0.62, 4, 0.012),

function balanceScale() {
  const g = new THREE.Group(), B = brass(0.24);
  g.add(new THREE.Mesh(lathe([line([0, 0], [0.27, 0]), arc([0.27, 0.015], 0.015, -90, 0, 6), line([0.285, 0.015], [0.285, 0.04]), quad([0.285, 0.04], [0.16, 0.05], [0.14, 0.09]),
    arc([0.14, 0.105], 0.015, -90, 90, 8), quad([0.14, 0.12], [0.06, 0.13], [0.04, 0.2]), line([0.04, 0.2], [0, 0.2])]), B));
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.03, 0.95, 32), B); pillar.position.y = 0.2 + 0.475; g.add(pillar);
  const pivotY = 1.17;
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.045, 32, 16), B); knob.position.y = pivotY; g.add(knob);
  const tilt = 0.09, half = 0.5;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, half * 2, 24), B); beam.rotation.z = Math.PI / 2 - tilt; beam.position.y = pivotY; g.add(beam);
  const panGeo = lathe([line([0, 0], [0.15, 0]), quad([0.15, 0], [0.19, 0.005], [0.2, 0.045]), line([0.2, 0.045], [0.19, 0.045]), quad([0.19, 0.045], [0.18, 0.012], [0.14, 0.01]), line([0.14, 0.01], [0, 0.01])]);
  const hang = 0.5;
  [[-1, 'light'], [1, 'heavy']].forEach(([side, kind]) => {
    const ex = side * half * Math.cos(tilt), ey = pivotY - side * half * Math.sin(tilt);
    const end = new THREE.Mesh(new THREE.SphereGeometry(0.024, 24, 12), B); end.position.set(ex, ey, 0); g.add(end);
    const pan = new THREE.Mesh(panGeo, B); pan.position.set(ex, ey - hang, 0); g.add(pan);
    for (let k = 0; k < 3; k++) {
      const a = k * Math.PI * 2 / 3 + Math.PI / 2, rx = ex + Math.cos(a) * 0.19, rz = Math.sin(a) * 0.19, ry = ey - hang + 0.045;
      const from = new THREE.Vector3(ex, ey, 0), to = new THREE.Vector3(rx, ry, rz), len = from.distanceTo(to);
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, len, 8), B);
      rod.position.copy(from).add(to).multiplyScalar(0.5); rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), to.clone().sub(from).normalize()); g.add(rod);
    }

    const cube = new THREE.Mesh(new RoundedBoxGeometry(size, size, size, 4, 0.012), kind === 'heavy' ? navyLacquer() : whiteMatte());
    cube.position.set(ex, ey - hang + 0.01 + size / 2, 0); cube.rotation.y = kind === 'heavy' ? 0.35 : -0.2; g.add(cube);
  });

  return g;
}

function twistTower() {

  const plinth = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.05, 0.62, 4, 0.01), brass(0.28)); plinth.position.y = 0.025; g.add(plinth);
  const slab = whiteMatte(0.6), pane = env(new THREE.MeshPhysicalMaterial({ color: '#bcd0df', roughness: 0.1, metalness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.05 }), 1.2);
  for (let i = 0; i < floors; i++) {

    const s = new THREE.Mesh(new RoundedBoxGeometry(size, 0.01, size, 2, 0.003), slab); s.position.y = y + 0.005; s.rotation.y = rot; g.add(s);
    const p = new THREE.Mesh(new THREE.BoxGeometry(size - 0.016, step - 0.01, size - 0.016), pane); p.position.y = y + 0.01 + (step - 0.01) / 2; p.rotation.y = rot + (Math.PI / 2) / floors / 2; g.add(p);

}

async function sceneTowers() {
  ENV = studioEnv();
  const sky = new THREE.Color(q.get('sky') ? '#' + q.get('sky') : '#e8eff5');
  scene.background = sky;
  scene.fog = new THREE.FogExp2(sky, num('fog', 0.03));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), env(new THREE.MeshStandardMaterial({ color: '#edf2f6', roughness: 1 }), 0.25));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const white = env(new THREE.MeshStandardMaterial({ color: '#f2f5f8', roughness: 0.75 }), 0.4);
  const glass = env(new THREE.MeshPhysicalMaterial({ color: '#d3e0ea', roughness: 0.18, metalness: 0.3, clearcoat: 0.5 }), 0.9);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function tower(x, z, w, d, h, mat) {
    const g = new THREE.Group();
    let y = 0, cw = w, cd = d, left = h;
    const tiers = 1 + Math.floor(rnd() * 3);
    for (let i = 0; i < tiers && left > 0.01; i++) {
      const th = i === tiers - 1 ? left : left * (0.6 + rnd() * 0.2);
      const b = new THREE.Mesh(new RoundedBoxGeometry(cw, th, cd, 2, 0.02), mat);
      b.position.y = y + th / 2; g.add(b);
      y += th; left -= th; cw *= 0.8; cd *= 0.8;
    }
    shadowed(g); g.position.set(x, 0, z); g.rotation.y = (rnd() - 0.5) * 0.3; scene.add(g);
  }
  for (let i = 0; i < 70; i++) {
    const z = -6 - rnd() * 44, x = (rnd() - 0.5) * (8 + (-z) * 0.9);
    if (Math.abs(x - 1.2) < 2.2 && z < -18 && z > -30) continue; // keep air around the supertall
    if (z > -11 && Math.abs(x) > 1.6) continue;                   // no big blocks right at the lens
    if (z > -24 && Math.abs(x - 1.2 * (8 - z) / 32) < 1.0 + 0.02 * (8 - z)) continue; // clear sightline to the supertall
    const h = 2 + rnd() * (4 + (-z) * 0.22), w = 0.8 + rnd() * 1.1;
    tower(x, z, w, w * (0.7 + rnd() * 0.5), h, rnd() < 0.35 ? glass : white);
  }
  // supertall: tapering setbacks + spire (abstracted, not a replica)
  const st = new THREE.Group();
  let y = 0; const tiers = 11;
  for (let i = 0; i < tiers; i++) {
    const r = 1.35 * Math.pow(1 - i / tiers, 1.1) + 0.12, h = 2.1 - i * 0.07;
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.97, r, h, 6, 1), glass);
    m.rotation.y = (i % 3) * Math.PI / 9; m.position.y = y + h / 2; st.add(m); y += h;
  }
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.12, 5.5, 12), white); spire.position.y = y + 2.75; st.add(spire);
  shadowed(st); st.position.set(1.2, 0, -24); scene.add(st);
  keyLight({ pos: [30, 22, 10], target: [0, 0, -20], intensity: num('key', 2.4), color: '#fff3e2', size: 40, radius: 3, map: 4096, far: 120 });
  fill([-12, 8, 10], num('fill', 0.55));
  camera.fov = num('fov', 40); camera.updateProjectionMatrix();
  camera.position.set(num('cx', 0), num('cy', 1.6), num('cz', 8)); camera.lookAt(num('lx', 0.6), num('ly', 9), -24);
}
